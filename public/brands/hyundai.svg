<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80">
  <!-- Hyundai H in oval -->
  <ellipse cx="100" cy="40" rx="98" ry="38" fill="#002C5F"/>
  <!-- H letterform: left vertical, right vertical, diagonal crossbar -->
  <rect x="52" y="18" width="12" height="44" fill="white"/>
  <rect x="136" y="18" width="12" height="44" fill="white"/>
  <!-- Diagonal crossbar (slanted left to right) -->
  <polygon points="64,38 136,28 148,32 64,44" fill="white"/>
</svg>
