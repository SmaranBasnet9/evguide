<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Renault 2021: stacked diamond outline -->
  <!-- Outer diamond -->
  <polygon points="100,5 195,80 100,155 5,80" fill="none" stroke="#FFCC00" stroke-width="12"/>
  <!-- Inner diamond cutout -->
  <polygon points="100,35 165,80 100,125 35,80" fill="none" stroke="#FFCC00" stroke-width="12"/>
  <!-- Center vertical bar -->
  <rect x="94" y="5" width="12" height="150" fill="#FFCC00"/>
  <!-- Clip to diamond shape using overlay -->
  <polygon points="100,5 195,80 100,155 5,80" fill="#FFCC00" opacity="0"/>
</svg>
